[package]
name = "tabula_rasa"
version = "1.0.0"
edition = "2024"
description = "Tabula Rasa - a clean, simple uninstaller"

[[bin]]
name = "TabulaRasa"
path = "src/main.rs"

[dependencies]
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
trash = "5.3.0"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp"] }
winreg = { version = "0.56.0", default-features = false }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
